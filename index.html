<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
          table, th, td {
            border: 1px solid;
          }
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>
      
          <img src="plate_blue.jpg" width="50">
          <img src="plate_yellow.jpg" width="50">
      
        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
               <td>Breakfast</td>
               <td>Pancakes with bacon and fruit </td>
               <td>10$</td>
            </tbody>
            <tbody>
               <td>Lunch</td>
               <td>Chicken Ceasar Salad</td>
               <td>8.50$</td>
            </tbody>
            <tbody>
               <td>Dinner</td>
               <td>Grilled Cheese with Tomato Soup</td>
               <td>10$</td>
            </tbody>
            <tbody>
               <td>Desert</td>
               <td>Chocolate Caramel Pudding</td>
               <td>5$</td>
            </tbody>
        </table>


    </body>
</html>
